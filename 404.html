<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ページが見つかりません</title>
<style>
  body { margin: 0; padding: 32px 16px; font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif; line-height: 1.7; color: #111827; background: #ffffff; text-align: center; }
  a { display: inline-block; min-height: 44px; line-height: 44px; padding: 0 20px; border-radius: 8px; background: #2563eb; color: #ffffff; text-decoration: none; }
  @media (prefers-color-scheme: dark) { body { color: #f3f4f6; background: #111827; } }
</style>
</head>
<body>
<h1>ページが見つかりません</h1>
<p>アドレスが間違っているか、ページが移動した可能性があります。</p>
<p><a id="back" href="./">アプリに戻る</a></p>
<script>
  // GitHub Pages の存在しないパスでも、この 404.html が返る。「アプリに戻る」は、アドレスの最初の区切り（/<公開リポジトリ名>/）へ。取れなければ /
  var m = /^\/[^\/]+\//.exec(location.pathname);
  document.getElementById('back').href = m ? m[0] : '/';
</script>
</body>
</html>
